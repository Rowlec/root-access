      <text x="34" y="20" font-size="11.5" font-weight="700" fill="#0f172a">Edge Cache &amp; Storage</text>
      <text x="12" y="36" font-size="9" font-weight="500" fill="#64748b">Cache selectors, token session</text>
      <text x="12" y="47" font-size="8.5" font-weight="500" fill="#64748b">Credit Ledger &amp; Event Logs</text>
    </g>
