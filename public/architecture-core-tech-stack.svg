<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" style="background:#ffffff; font-family:'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <!-- Drop shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
    <filter id="boxShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- BACKGROUND RECT -->
  <rect x="0" y="0" width="1200" height="740" fill="#ffffff" rx="20" />

  <!-- HEADER -->
  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a">Core tech stack</text>
  <text x="600" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">Kiến trúc kỹ thuật nền tảng RootAccess · EXE201 FA26</text>
  <rect x="1060" y="32" width="95" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="1107" y="49" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">EXE201 · FA26</text>

  <!-- SECTION 1: CLIENTS (X: 45, Y: 110, W: 215) -->
  <text x="152" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#1e293b">Clients</text>

  <!-- Client 1: Chrome Extension -->
  <g transform="translate(45, 145)" filter="url(#cardShadow)">
    <rect width="215" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="12" y="16" width="44" height="44" rx="10" fill="#e0f2fe" />
    <path d="M 24 38 L 44 38 M 34 26 L 34 50" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="68" y="35" font-size="13" font-weight="700" fill="#0f172a">Chrome Extension</text>
    <text x="68" y="52" font-size="11" font-weight="500" fill="#64748b">Sidepanel Manifest V3</text>
    <rect x="68" y="60" width="112" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="124" y="73" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155" font-family="'JetBrains Mono', monospace">React 19 · Vite</text>
  </g>
  <!-- Connector 1 -->
  <line x1="260" y1="190" x2="310" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Client 2: Web Application -->
  <g transform="translate(45, 260)" filter="url(#cardShadow)">
    <rect width="215" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="12" y="16" width="44" height="44" rx="10" fill="#fdf2f8" />
    <rect x="22" y="28" width="24" height="18" rx="3" fill="none" stroke="#db2777" stroke-width="2" />
    <line x1="28" y1="48" x2="40" y2="48" stroke="#db2777" stroke-width="2" />
    <text x="68" y="35" font-size="13" font-weight="700" fill="#0f172a">Web Application</text>
    <text x="68" y="52" font-size="11" font-weight="500" fill="#64748b">Workspace &amp; Studio</text>
    <rect x="68" y="60" width="125" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="130" y="73" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155" font-family="'JetBrains Mono', monospace">Next.js 16 · Tailwind</text>
  </g>
  <!-- Connector 2 -->
  <line x1="260" y1="305" x2="310" y2="305" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Client 3: Injected Host (ChatGPT / Gemini) -->
  <g transform="translate(45, 375)" filter="url(#cardShadow)">
    <rect width="215" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="12" y="16" width="44" height="44" rx="10" fill="#f0fdf4" />
    <circle cx="34" cy="38" r="10" fill="none" stroke="#16a34a" stroke-width="2" />
    <path d="M 30 38 L 33 41 L 39 34" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <text x="68" y="35" font-size="13" font-weight="700" fill="#0f172a">AI Host Injected</text>
    <text x="68" y="52" font-size="11" font-weight="500" fill="#64748b">ChatGPT / Gemini DOM</text>
    <rect x="68" y="60" width="134" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="73" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155" font-family="'JetBrains Mono', monospace">Content Script (Highlighter)</text>
  </g>
  <!-- Connector 3 -->
  <line x1="260" y1="420" x2="310" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />


