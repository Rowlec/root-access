    <ellipse cx="110" cy="22" rx="110" ry="20" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>

    <!-- Content 1: Relational Database (Metadata) -->
    <text x="20" y="65" font-size="10" font-weight="800" fill="#475569" letter-spacing="0.5">RELATIONAL DATABASE</text>
    <g transform="translate(15, 74)">
      <rect width="190" height="74" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
