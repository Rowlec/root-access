    <!-- Service 1: Grader Engine -->
    <rect x="20" y="108" width="155" height="74" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="128" font-size="11.5" font-weight="700" fill="#1e293b">🎯 Grader Engine</text>
    <text x="32" y="145" font-size="9.5" font-weight="500" fill="#64748b">Chấm theo mục tiêu</text>
    <text x="32" y="159" font-size="9.5" font-weight="500" fill="#64748b">(Pass/Good/Excel), lọc gap</text>
    <text x="32" y="173" font-size="9" font-weight="600" fill="#0284c7">Mốc anchor bài mẫu 9–10</text>

    <!-- Service 2: Fix Prompt Engine -->
    <rect x="185" y="108" width="155" height="74" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="197" y="128" font-size="11.5" font-weight="700" fill="#1e293b">✍️ Fix Prompt Engine</text>
    <text x="197" y="145" font-size="9.5" font-weight="500" fill="#64748b">Prompt sửa 6 bước</text>
    <text x="197" y="159" font-size="9.5" font-weight="500" fill="#64748b">Khóa các câu đạt chuẩn</text>
    <text x="197" y="173" font-size="9" font-weight="600" fill="#ea580c">Chống AI bịa số liệu</text>

    <!-- Service 3: Wallet & Credits -->
