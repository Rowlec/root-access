      <rect x="8" y="10" width="30" height="30" rx="6" fill="#0284c7" />
      <text x="23" y="30" text-anchor="middle" font-size="14">💳</text>
      <text x="46" y="25" font-size="11.5" font-weight="700" fill="#0f172a">PayOS</text>
      <text x="46" y="39" font-size="9.5" font-weight="500" fill="#64748b">Cổng VietQR 24/7</text>
    </g>

