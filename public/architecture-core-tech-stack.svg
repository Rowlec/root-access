    <!-- Sub-container: API Gateway Banner -->
    <rect x="20" y="20" width="320" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="32" y="31" width="30" height="30" rx="6" fill="#0f172a" />
    <text x="47" y="51" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">▲</text>
    <text x="72" y="42" font-size="12" font-weight="700" fill="#0f172a">API Gateway &amp; Route Handlers</text>
    <text x="72" y="58" font-size="10.5" font-weight="500" fill="#64748b">Next.js App Router (/api/*) · Edge Middleware</text>

    <!-- Services Header -->
    <text x="22" y="98" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.5">CORE ENGINES &amp; SERVICES</text>

