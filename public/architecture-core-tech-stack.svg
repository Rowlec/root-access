    <text x="32" y="210" font-size="11.5" font-weight="700" fill="#1e293b">💳 Wallet &amp; Ledger</text>
    <text x="32" y="227" font-size="9.5" font-weight="500" fill="#64748b">Trừ credit nguyên tử</text>
    <text x="32" y="241" font-size="9.5" font-weight="500" fill="#64748b">Webhook PayOS QR</text>
    <text x="32" y="255" font-size="9" font-weight="600" fill="#16a34a">Bảo toàn giao dịch (ACID)</text>

