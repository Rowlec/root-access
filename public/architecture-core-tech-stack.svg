      <rect width="165" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="8" y="10" width="30" height="30" rx="6" fill="#ea580c" />
      <text x="23" y="30" text-anchor="middle" font-size="14">✨</text>
      <text x="46" y="25" font-size="11.5" font-weight="700" fill="#0f172a">Google Gemini</text>
      <text x="46" y="39" font-size="9.5" font-weight="500" fill="#64748b">Gemini 2.5 Flash LLM</text>
    </g>

