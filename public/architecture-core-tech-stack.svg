    <g transform="translate(15, 174)">
      <rect width="190" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="12" y="24" font-size="16">🌟</text>
      <text x="36" y="22" font-size="12" font-weight="700" fill="#0f172a">18+ Bài mẫu điểm cao</text>
      <text x="36" y="38" font-size="9.5" font-weight="500" fill="#64748b">Bảng examples (Điểm 9.5-10)</text>
      <text x="12" y="55" font-size="8.5" font-weight="600" fill="#059669">Mốc neo rubric &amp; "Vì sao tốt"</text>
    </g>

    <!-- Content 3: Caching & Ledger -->
    <text x="20" y="255" font-size="10" font-weight="800" fill="#475569" letter-spacing="0.5">CACHING &amp; AUDIT</text>
    <g transform="translate(15, 264)">
      <rect width="190" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
