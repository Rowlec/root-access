      <text x="36" y="22" font-size="12" font-weight="700" fill="#0f172a">Neon PostgreSQL</text>
      <text x="36" y="38" font-size="9.5" font-weight="500" fill="#64748b">Serverless PostgreSQL 16</text>
      <text x="12" y="55" font-size="9" font-weight="600" fill="#2563eb">Drizzle ORM Type-Safe</text>
      <text x="12" y="68" font-size="8.5" font-weight="500" fill="#64748b">projects, grades, wallets</text>
    </g>

    <!-- Content 2: High-Scoring Examples Library -->
