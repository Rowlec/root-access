      <rect width="160" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="8" y="10" width="30" height="30" rx="6" fill="#10a37f" />
      <text x="23" y="30" text-anchor="middle" font-size="14">💬</text>
      <text x="46" y="25" font-size="11.5" font-weight="700" fill="#0f172a">ChatGPT Web</text>
      <text x="46" y="39" font-size="9.5" font-weight="500" fill="#64748b">Nền tảng viết của SV</text>
    </g>

    <!-- Google OAuth -->
    <g transform="translate(505, 0)" filter="url(#cardShadow)">
      <rect width="150" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="8" y="10" width="30" height="30" rx="6" fill="#dc2626" />
      <text x="23" y="30" text-anchor="middle" font-size="14">🔑</text>
      <text x="46" y="25" font-size="11.5" font-weight="700" fill="#0f172a">Google Auth</text>
      <text x="46" y="39" font-size="9.5" font-weight="500" fill="#64748b">SSO Email FPTU</text>
    </g>

    <!-- Chrome Web Store -->
    <g transform="translate(665, 0)" filter="url(#cardShadow)">
