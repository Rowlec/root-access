    <text x="380" y="88" font-size="10" font-weight="800" fill="#64748b" letter-spacing="0.5">FRAMEWORK</text>
    <text x="380" y="106" font-size="12" font-weight="700" fill="#0f172a">Next.js 16 (Turbopack)</text>

    <text x="380" y="138" font-size="10" font-weight="800" fill="#64748b" letter-spacing="0.5">INFRA AS CODE</text>
    <text x="380" y="156" font-size="12" font-weight="700" fill="#0f172a">Drizzle Schema ORM</text>

    <text x="380" y="188" font-size="10" font-weight="800" fill="#64748b" letter-spacing="0.5">API &amp; VALIDATION</text>
    <text x="380" y="206" font-size="12" font-weight="700" fill="#0f172a">REST API · Zod v3</text>

    <text x="380" y="238" font-size="10" font-weight="800" fill="#64748b" letter-spacing="0.5">AI ENGINE</text>
    <text x="380" y="256" font-size="12" font-weight="700" fill="#0284c7">Gemini 2.5 Flash</text>

    <text x="380" y="288" font-size="10" font-weight="800" fill="#64748b" letter-spacing="0.5">DEPLOYMENT</text>
    <text x="380" y="306" font-size="12" font-weight="700" fill="#0f172a">Vercel Global Edge</text>
