    <rect x="20" y="292" width="155" height="26" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="97" y="309" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">☁️ Vercel Serverless Edge</text>

    <rect x="185" y="292" width="155" height="26" rx="6" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1"/>
