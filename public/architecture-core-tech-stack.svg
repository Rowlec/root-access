    <rect x="185" y="190" width="155" height="74" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="197" y="210" font-size="11.5" font-weight="700" fill="#1e293b">💡 Idea Studio</text>
    <text x="197" y="227" font-size="9.5" font-weight="500" fill="#64748b">Làm rõ ngách (Niche)</text>
    <text x="197" y="241" font-size="9.5" font-weight="500" fill="#64748b">Bắt lỗi gộp đối tượng</text>
    <text x="197" y="255" font-size="9" font-weight="600" fill="#9333ea">Hỏi nhanh 2-4 câu</text>

